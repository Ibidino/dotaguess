<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dota 2 Hero Guessing Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes bounceIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}.animate-bounceIn{animation:bounceIn .4s both}
  </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col items-center min-h-screen py-4">
  <div class="w-full max-w-6xl">
    <header class="text-center mb-4">
      <h1 class="text-2xl sm:text-3xl font-bold mb-1">Guess <span class="text-red-400">ALL</span> Dota 2 Heroes</h1>
      <p class="text-gray-400 text-sm">Press <strong>Start</strong>, type a hero, hit <kbd class="border px-1 rounded">Enter</kbd></p>
    </header>

    <div class="flex flex-wrap justify-center items-center gap-4 mb-4">
      <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 px-5 py-1.5 rounded-lg text-base font-semibold">Start</button>
      <div id="timer" class="text-xl font-mono">00:00</div>
      <div class="text-base"><span id="counter">0</span> / <span id="total">0</span></div>
    </div>

    <div class="flex justify-center mb-4">
      <input id="heroInput" type="text" placeholder="Anti‑Mage, Axe…" class="w-full max-w-md px-3 py-2 bg-gray-800 rounded-lg focus:outline-none focus:ring focus:ring-blue-500 disabled:opacity-30" disabled />
    </div>

    <ul id="heroGrid" class="grid grid-cols-10 sm:grid-cols-12 md:grid-cols-14 lg:grid-cols-16 xl:grid-cols-17 gap-1 place-items-center mx-auto select-none"></ul>
  </div>

  <div id="popup" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden">
    <div class="bg-gray-800 p-8 rounded-2xl text-center shadow-xl w-11/12 max-w-md animate-bounceIn">
      <h2 class="text-2xl font-bold mb-3">Congratulations!</h2>
      <p class="mb-1">You named every hero in</p>
      <p id="finalTime" class="text-3xl font-mono mb-6">00:00</p>
      <button id="restartBtn" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg text-lg font-semibold">Play Again</button>
    </div>
  </div>

  <script>
    // helper utilities
    const normalize = s => s.toLowerCase().replace(/[^a-z]/g, "");
    const fmtTime = ms => {
      const s = Math.floor(ms/1000);
      return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
    };

    // hero data
    const heroes=["Abaddon","Alchemist","Ancient Apparition","Anti-Mage","Arc Warden","Axe","Bane","Batrider","Beastmaster","Bloodseeker","Bounty Hunter","Brewmaster","Bristleback","Broodmother","Centaur Warrunner","Chaos Knight","Chen","Clinkz","Clockwerk","Crystal Maiden","Dark Seer","Dark Willow","Dawnbreaker","Dazzle","Death Prophet","Disruptor","Doom","Dragon Knight","Drow Ranger","Earth Spirit","Earthshaker","Elder Titan","Ember Spirit","Enchantress","Enigma","Faceless Void","Grimstroke","Gyrocopter","Hoodwink","Huskar","Invoker","Io","Jakiro","Juggernaut","Keeper of the Light","Kunkka","Legion Commander","Leshrac","Lich","Lifestealer","Lina","Lion","Lone Druid","Luna","Lycan","Magnus","Marci","Mars","Medusa","Meepo","Mirana","Monkey King","Morphling","Muerta","Naga Siren","Nature's Prophet","Necrophos","Night Stalker","Nyx Assassin","Ogre Magi","Omniknight","Oracle","Outworld Destroyer","Pangolier","Phantom Assassin","Phantom Lancer","Phoenix","Primal Beast","Puck","Pudge","Pugna","Queen of Pain","Razor","Riki","Ringmaster","Rubick","Sand King","Shadow Demon","Shadow Fiend","Shadow Shaman","Silencer","Skywrath Mage","Slardar","Slark","Snapfire","Sniper","Spectre","Spirit Breaker","Storm Spirit","Sven","Techies","Templar Assassin","Terrorblade","Tidehunter","Timbersaw","Tinker","Tiny","Treant Protector","Troll Warlord","Tusk","Underlord","Undying","Ursa","Vengeful Spirit","Venomancer","Viper","Visage","Void Spirit","Warlock","Weaver","Windranger","Winter Wyvern","Witch Doctor","Wraith King","Zeus"];
    const canonical=heroes.map(normalize);

    // alias mapping
    const alias={centaur:"centaurwarrunner",treant:"treantprotector",nightstalker:"nightstalker",antimage:"antimage",bounty:"bountyhunter",drow:"drowranger",troll:"trollwarlord",kotl:"keeperofthelight",od:"outworlddestroyer",nyx:"nyxassassin",outworlddevourer:"outworlddestroyer"};

    // slug exceptions
    const slug={antimage:"anti_mage",centaurwarrunner:"centaur",lifestealer:"life_stealer",naturesprophet:"natures_prophet",outworlddestroyer:"outworld_destroyer",queenofpain:"queenofpain",shadowfiend:"shadow_fiend",wraithking:"wraith_king"};

    // DOM refs
    const grid=document.getElementById('heroGrid');
    const startBtn=document.getElementById('startBtn');
    const heroInput=document.getElementById('heroInput');
    const timerEl=document.getElementById('timer');
    const counterEl=document.getElementById('counter');
    const totalEl=document.getElementById('total');
    const popup=document.getElementById('popup');
    const finalTimeEl=document.getElementById('finalTime');
    const restartBtn=document.getElementById('restartBtn');

    // state
    let guessed=new Set();
    let startTime=null,interval=null;
    totalEl.textContent=heroes.length;

    // placeholders with Dota logo svg (base64)
    const PLACEHOLDER="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA2NCA2NCc+PHJlY3Qgd2lkdGg9JzY0JyBoZWlnaHQ9JzY0JyBmaWxsPScjYjczMjE5Jy8+PHJlY3QgeD0nMTgnIHk9JzE4JyB3aWR0aD0nMjgnIGhlaWdodD0nMjgnIGZpbGw9JyM4YjFlMGYnLz48cGF0aCBkPSdNNDYgMThMMTggNDYnIHN0cm9rZT0nI2I3MzIxOScgc3Ryb2tlLXdpZHRoPSc2Jy8+PC9zdmc+";

    // build grid
    heroes.forEach((h,i)=>{
      const li=document.createElement('li');
      li.dataset.hero=canonical[i];
      li.className='w-10 h-10 sm:w-12 sm:h-12 bg-[#4a2e19] rounded';
      li.style.backgroundImage=`url(${PLACEHOLDER})`;
      li.style.backgroundSize='contain';
      li.style.backgroundRepeat='no-repeat';
      li.style.backgroundPosition='center';
      grid.appendChild(li);
    });

    // util functions
    const heroSlug=c=>slug[c]||heroes[canonical.indexOf(c)].toLowerCase().replace(/['.-]/g,'').replace(/\s+/g,'_');
    const heroImg=c=>`https://cdn.dota2.com/apps/dota2/images/heroes/${heroSlug(c)}_full.png`;
    const resetGrid=()=>grid.querySelectorAll('li').forEach(li=>{li.style.backgroundImage=`url(${PLACEHOLDER})`;li.style.backgroundSize='contain'});

    // game flow
    function startGame(){
      guessed.clear();
      counterEl.textContent='0';
      heroInput.value='';
      heroInput.disabled=false;
      heroInput.focus();
      resetGrid();
      startTime=Date.now();
      timerEl.textContent='00:00';
      clearInterval(interval);
      interval=setInterval(()=>timerEl.textContent=fmtTime(Date.now()-startTime),1000);
    }
    function win(){
      clearInterval(interval);
      finalTimeEl.textContent=timerEl.textContent;
      heroInput.disabled=true;
      popup.classList.remove('hidden');
    }

    // listeners
    startBtn.addEventListener('click',()=>{popup.classList.add('hidden');startGame();});
    restartBtn.addEventListener('click',()=>{popup.classList.add('hidden');startGame();});

    heroInput.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      let val=normalize(heroInput.value.trim());
      if(!val)return;
      val=alias[val]||val;
      if(!canonical.includes(val)||guessed.has(val)){
        heroInput.value='';return;
      }
      guessed.add(val);
      counterEl.textContent=guessed.size;
      const li=grid.querySelector(`[data-hero="${val}"]`);
      if(li){
        li.style.backgroundImage=`url(${heroImg(val)})`;
        li.style.backgroundSize='contain';
        li.style.backgroundPosition='center';
        li.style.backgroundRepeat='no-repeat';
      }
      heroInput.value='';
      if(guessed.size===heroes.length)win();
    });
  </script>
</body>
</html>
